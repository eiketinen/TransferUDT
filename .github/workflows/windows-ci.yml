name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore vcpkg packages for Server
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows-static --x-manifest-root=ServerUDTC++_v3

      - name: Restore vcpkg packages for Agent
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows-static --x-manifest-root=AgentUDTC++_v7.2

      # The test projects build in vcpkg manifest mode and need the vcpkg
      # MSBuild integration to resolve spdlog/openssl/udt headers. A clean
      # runner is not integrated, so do it explicitly. Without this the build
      # fails with C1083 missing-header errors (this CI had never passed).
      - name: Integrate vcpkg with MSBuild
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install

      - name: Build Server tests
        shell: pwsh
        run: |
          msbuild ServerUDTC++_v3\ServerUDTC++Tests.vcxproj /p:Configuration=Debug /p:Platform=x64 /m

      - name: Run Server tests
        shell: pwsh
        run: |
          .\ServerUDTC++_v3\tests\bin\Debug\ServerUDTC++Tests.exe

      - name: Build Agent tests
        shell: pwsh
        run: |
          msbuild AgentUDTC++_v7.2\AgentUDTC++Tests.vcxproj /p:Configuration=Debug /p:Platform=x64 /m

      - name: Run Agent tests
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\AgentUDTCppTests\bin\Debug\AgentUDTC++Tests.exe"

      - name: Build Dashboard
        shell: pwsh
        run: dotnet build DashboardWeb\DashboardWeb.csproj --configuration Release

      - name: Run Dashboard observability E2E
        shell: pwsh
        run: .\scripts\e2e-dashboard-https.ps1 -UseHttpForLocalTest
