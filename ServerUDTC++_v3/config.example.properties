# Server listen port
server.port = 50051
server.bind_address = 127.0.0.1
server.allowed_clients = 127.0.0.1

# Runtime paths
server.storage_path = C:/TransferUDT/Server/storage
server.reconstructed_path = C:/TransferUDT/Server/reconstructed
server.max_file_size_mb = 10240
server.max_client_storage_mb = 20480

# Policy when a new transfer starts for a same logical path already managed by
# the Server: overwrite, reject, or versioned.
resend.changed_files.server_policy = overwrite

log.filepath = C:/TransferUDT/Server/log/server.log
db.filepath = C:/TransferUDT/Server/db/server.db

# UDT settings
max.band = 10
seg.len = 1350
snd.buf = 64
rcv.buf = 64
snd.timeout = 60
rcv.timeout = 60

# Worker and connection settings
work.threads = 4
work.max_pending_tasks = 256
max.connection = 100

# Circuit breaker
circuitbreaker.failure.threshold = 5
circuitbreaker.reset.timeout.seconds = 60

# Logging
log.max_size_mb = 50
log.backup_count = 5
log.flush_level = warn

# Test-only ACK delay pattern, in milliseconds by chunk number. Leave empty in
# production. Example: 0,0,0,800,800,0
test.ack_delay_pattern_ms =

# Security. Prefer one PSK per Agent. The Agent's security.psk must match its
# server-side security.client_psk.<client_id>. Do not commit real secrets.
security.enabled = true
security.handshake.enabled = true
security.allow_insecure = false
security.identity.mode = psk
security.allowed_client_ids = agent-default
security.client_psk.agent-default = replace-with-a-strong-shared-secret-of-32-plus-chars
# Optional global fallback for single-agent deployments:
# security.psk = replace-with-a-strong-shared-secret-of-32-plus-chars

# Private-network production option. Use signed_handshake to authenticate each
# Agent with its public signing key and derive per-session AES keys with
# ephemeral X25519. Keep PSK entries only for legacy psk mode.
# security.identity.mode = signed_handshake
# security.server_private_key_path = C:/ProgramData/TransferUDT/Server/keys/server.key
# security.client_public_key.agent-default = C:/ProgramData/TransferUDT/Server/clients/agent-default.pub

# High-assurance option. certificate_handshake accepts only CA-trusted Agent
# certificates whose SAN/CN matches security.client_id and the allowlist.
# security.identity.mode = certificate_handshake
# security.server_certificate_path = C:/ProgramData/TransferUDT/Server/pki/server-chain.pem
# security.ca_bundle_path = C:/ProgramData/TransferUDT/Server/pki/ca.pem
