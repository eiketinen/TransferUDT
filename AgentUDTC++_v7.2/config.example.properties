# Server target address (host:port)
server.targets = 127.0.0.1:50051

# Chunk size in KB
chunk.size = 256

# Directories watched by the Agent. Use semicolon-separated paths.
data.dirs = C:/TransferUDT/Agent/incoming

# Bandwidth in MB/s
max.band = 10

# UDT settings
seg.len = 1350
snd.buf = 64
rcv.buf = 64
snd.timeout = 20
rcv.timeout = 20

# Retry settings
max.retries = 5
max.retries.abandon = 25

# Worker and watcher settings
work.threads = 4
stability.check.interval.seconds = 5
stability.check.count = 3
watcher.check.interval.seconds = 5
pending.check.interval.seconds = 15

# Circuit breaker
circuitbreaker.failure.threshold = 5
circuitbreaker.reset.timeout.seconds = 60

# Memory limit percentage for chunk calculation
memory.usage.percent.limit = 70

# Runtime paths
log.filepath = C:/TransferUDT/Agent/log/agent.log
log.max_size_mb = 50
log.backup_count = 5
log.move.rotate = true
watcher.exclude.files = agent.log
db.filepath = C:/TransferUDT/Agent/db/agent.db

# Connection pool
pool.size = 4

# Flush level: always, info, warn, error, never
log.flush_level = warn

# Security. Match this PSK to the Server's security.client_psk.<client_id>.
# Do not commit real secrets.
security.enabled = true
security.handshake.enabled = true
security.allow_insecure = false
security.client_id = agent-default
security.psk = replace-with-a-strong-shared-secret-of-32-plus-chars
