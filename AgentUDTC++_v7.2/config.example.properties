# Server target address (host:port)
server.targets = 127.0.0.1:50051

# Chunk size in KB
chunk.size = 256

# Adaptive chunk sizing. When enabled, the Agent chooses the next chunk size at
# send time from endpoint ACK/throughput telemetry. Non-final adaptive chunks
# use total_chunk=0; the final chunk declares the actual total count.
chunk.adaptive.enabled = false
chunk.adaptive.min_kb = 32
chunk.adaptive.max_kb = 4096
chunk.adaptive.initial_kb = 256
chunk.adaptive.target_ack_ms = 700

# Directories watched by the Agent. Use semicolon-separated paths.
data.dirs = C:/TransferUDT/Agent/incoming

# Re-send the same watched path only when its content fingerprint changes.
# identity currently supports sha256.
resend.changed_files.enabled = true
resend.changed_files.identity = sha256

# Bandwidth in MB/s
max.band = 10

# UDT settings
seg.len = 1350
snd.buf = 64
rcv.buf = 64
snd.timeout = 20
rcv.timeout = 20

# Retry settings
max.retries = 5
max.retries.abandon = 25

# Worker and watcher settings
work.threads = 4
stability.check.interval.seconds = 5
stability.check.count = 3
watcher.check.interval.seconds = 5
pending.check.interval.seconds = 15

# Circuit breaker
circuitbreaker.failure.threshold = 5
circuitbreaker.reset.timeout.seconds = 60

# Memory limit percentage for chunk calculation
memory.usage.percent.limit = 70

# Runtime paths
log.filepath = C:/TransferUDT/Agent/log/agent.log
log.max_size_mb = 50
log.backup_count = 5
log.move.rotate = true
watcher.exclude.files = agent.log
db.filepath = C:/TransferUDT/Agent/db/agent.db

# Connection pool
pool.size = 4

# Flush level: always, info, warn, error, never
log.flush_level = warn

# Security. Match this PSK to the Server's security.client_psk.<client_id>.
# Do not commit real secrets.
security.enabled = true
security.handshake.enabled = true
security.allow_insecure = false
security.identity.mode = psk
security.client_id = agent-default
security.psk = replace-with-a-strong-shared-secret-of-32-plus-chars

# Private-network production option. Use signed_handshake to authenticate each
# Agent with its private signing key and derive per-session AES keys with
# ephemeral X25519. Keep security.psk only for legacy psk mode.
# security.identity.mode = signed_handshake
# security.client_private_key_path = C:/ProgramData/TransferUDT/Agent/keys/agent-default.key
# security.server_public_key_path = C:/ProgramData/TransferUDT/Agent/keys/server.pub

# High-assurance option. certificate_handshake validates the Server certificate
# identity and CA chain, presents the Agent certificate, and proves possession
# of both private keys before deriving the ephemeral session key. This is an
# application-layer X.509 handshake over UDT, not TLS/mTLS transport.
# security.identity.mode = certificate_handshake
# security.client_certificate_path = C:/ProgramData/TransferUDT/Agent/pki/agent-default-chain.pem
# security.ca_bundle_path = C:/ProgramData/TransferUDT/Agent/pki/ca.pem
# security.revocation.mode = crl
# security.crl_path = C:/ProgramData/TransferUDT/Agent/pki/issuers.crl.pem
# security.certificate_expiry_warning_days = 30
# security.server_identity = transfer-server.example.internal

# Optional HTTPS observability dashboard. The Agent validates the Dashboard TLS
# certificate through the Windows trust store and signs each heartbeat with
# security.client_private_key_path.
dashboard.enabled = false
dashboard.url = https://server:8443
dashboard.heartbeat.interval.seconds = 15
dashboard.log_tail.lines = 200
